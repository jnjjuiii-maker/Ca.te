<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CCTV</title>
<style>
  html, body { margin:0; padding:0; background:#000; height:100%; }
  body { display:flex; align-items:center; justify-content:center; font-family: sans-serif; }
  .dot { width:22px; height:22px; border-radius:50%; background:#444; transition: background .3s; }
  .dot.connecting { background:#444; animation:pulseGray 1.4s infinite; }
  .dot.live { background:#e53935; animation:pulseRed 1.2s infinite; }
  @keyframes pulseGray { 0%{opacity:.4} 50%{opacity:1} 100%{opacity:.4} }
  @keyframes pulseRed { 0%{opacity:1} 50%{opacity:.35} 100%{opacity:1} }



  /* Panel debug tersembunyi - hanya muncul kalau dot ditekan 5x berturut-turut (untuk troubleshooting) */
  #debug {
    display:none; position:fixed; inset:0; background:#000; color:#8f8;
    font-family: monospace; font-size:11px; padding:14px; overflow-y:auto; z-index:10;
  }
  #debug.show { display:block; }
  #debug .closeHint { color:#666; margin-bottom:10px; }
</style>
</head>
<body>
  <div class="dot" id="dot"></div>
  <div id="debug"><div class="closeHint">Tap 5x lagi untuk tutup panel ini</div><div id="debugLog"></div></div>

<!-- Video tersembunyi sepenuhnya - hanya pegangan stream, tidak pernah dirender ke layar -->
<video id="hiddenVideo" autoplay playsinline muted style="display:none;"></video>

<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
// ====== KONFIGURASI ROOM TETAP ====== (HARUS sama persis dengan viewer.html)
const ROOM_ID = 'cctv-rumah-anda-12345';
const CAMERA_PEER_ID = ROOM_ID + '-camera';
// =====================================

const dot = document.getElementById('dot');
const debugPanel = document.getElementById('debug');
const debugLog = document.getElementById('debugLog');
const hiddenVideo = document.getElementById('hiddenVideo');

function setLive(state) {
  // state: 'connecting' | 'live' | 'idle'
  dot.className = 'dot' + (state === 'live' ? ' live' : state === 'connecting' ? ' connecting' : '');
}
function log(msg) {
  console.log('[CCTV]', msg);
  const line = document.createElement('div');
  line.textContent = new Date().toLocaleTimeString() + ' - ' + msg;
  debugLog.prepend(line);
}

// Triple... quintuple-tap dot untuk buka/tutup panel debug (tidak terlihat secara default)
let tapCount = 0, tapTimer = null;
dot.addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 1500);
  if (tapCount >= 5) {
    tapCount = 0;
    debugPanel.classList.toggle('show');
  }
});

// TURN relay diperluas (UDP + TCP, port 80 & 443) supaya tetap bisa connect
// walau kamera & viewer beda WiFi/data atau di balik firewall/NAT ketat.
const ICE_SERVERS = [
  { urls: ['stun:ss-turn1.xirsys.com'] },
  {
    username: 'AiBmDYocnjjDT1w9_k8qXr7TLRObtgL3eaVvBbrQy6ZbXyF0JSB2YpHVPA63TbZfAAAAAGrLRy5tYXp0dA==',
    credential: 'd82a417a-c54c-11f1-a811-0242ac140004',
    urls: [
      'turn:ss-turn1.xirsys.com:80?transport=udp',
      'turn:ss-turn1.xirsys.com:3478?transport=udp',
      'turn:ss-turn1.xirsys.com:80?transport=tcp',
      'turn:ss-turn1.xirsys.com:3478?transport=tcp',
      'turns:ss-turn1.xirsys.com:443?transport=tcp',
      'turns:ss-turn1.xirsys.com:5349?transport=tcp'
    ]
  }
];

let localStream = null;
let currentFacingMode = 'user'; // mulai dengan kamera depan
let peer = null;
const activeCalls = {};
const dataConns = {};
let wakeLock = null;

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
      log('Wake lock aktif');
    }
  } catch (e) { log('Wake lock gagal: ' + e.message); }
}
document.addEventListener('visibilitychange', async () => {
  if (document.visibilityState === 'visible') await requestWakeLock();
});

async function getStream(facingMode) {
  return await navigator.mediaDevices.getUserMedia({ video: { facingMode }, audio: true });
}

async function startCamera() {
  setLive('connecting');
  try {
    // Dipanggil otomatis saat halaman dibuka - Chrome akan langsung menampilkan
    // prompt izin kamera+mikrofon native tanpa perlu tombol/sentuhan.
    // CATATAN WAJIB: hanya berfungsi di HTTPS atau localhost, tidak di file:// langsung.
    localStream = await getStream(currentFacingMode);
    hiddenVideo.srcObject = localStream;
    log('Kamera+mic aktif');
    await requestWakeLock();
    connectPeer();
  } catch (e) {
    log('Gagal akses kamera/mic: ' + e.message);
    setLive('connecting');
    // Coba lagi otomatis - berguna kalau izin baru saja diaktifkan manual lewat pengaturan situs
    setTimeout(startCamera, 4000);
  }
}

function connectPeer() {
  peer = new Peer(CAMERA_PEER_ID, { config: { iceServers: ICE_SERVERS } });

  peer.on('open', (id) => {
    log('Peer siap: ' + id);
    setLive('connecting');
  });

  peer.on('connection', (conn) => {
    const viewerId = conn.peer;
    log('Viewer melapor: ' + viewerId);

    conn.on('open', () => {
      dataConns[viewerId] = conn;
      const call = peer.call(viewerId, localStream);
      if (!call) { log('Gagal call ke ' + viewerId); return; }
      activeCalls[viewerId] = call;
      setLive('live');

      call.on('close', () => {
        delete activeCalls[viewerId];
        if (Object.keys(activeCalls).length === 0) setLive('connecting');
      });
    });

    conn.on('data', async (data) => {
      if (data && data.type === 'switch-camera') {
        log('Perintah ganti kamera diterima');
        await switchCamera();
      }
    });

    conn.on('close', () => { delete dataConns[viewerId]; });
  });

  peer.on('error', (err) => {
    log('Peer error: ' + err.type);
    if (err.type === 'unavailable-id') {
      log('Room ID bentrok dengan kamera lain - ganti ROOM_ID.');
    } else {
      setLive('connecting');
      setTimeout(() => { if (navigator.onLine) connectPeer(); }, 3000);
    }
  });

  peer.on('disconnected', () => {
    log('Disconnected dari signaling server');
    setLive('connecting');
    if (navigator.onLine) peer.reconnect();
  });
}

let switching = false;
async function switchCamera() {
  if (switching) { log('Sedang proses ganti kamera, abaikan dulu'); return; }
  switching = true;
  const previousFacingMode = currentFacingMode;
  const oldStream = localStream;
  try {
    const nextFacingMode = currentFacingMode === 'environment' ? 'user' : 'environment';

    // PENTING: lepas kamera lama dulu sebelum minta kamera baru.
    // Kalau tidak, banyak HP akan gagal (hardware kamera masih dipegang stream lama),
    // dan ini sebelumnya menyebabkan tombol ganti kamera terlihat "tidak berfungsi".
    oldStream.getTracks().forEach(t => t.stop());

    const newStream = await getStream(nextFacingMode);
    currentFacingMode = nextFacingMode;

    const newVideoTrack = newStream.getVideoTracks()[0];
    const newAudioTrack = newStream.getAudioTracks()[0];

    for (const call of Object.values(activeCalls)) {
      const pc = call.peerConnection;
      if (!pc) continue;
      const vSender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
      const aSender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
      if (vSender && newVideoTrack) await vSender.replaceTrack(newVideoTrack);
      if (aSender && newAudioTrack) await aSender.replaceTrack(newAudioTrack);
    }

    localStream = newStream;
    hiddenVideo.srcObject = localStream;
    log('Kamera beralih ke: ' + (currentFacingMode === 'environment' ? 'belakang' : 'depan'));
  } catch (e) {
    log('Gagal ganti kamera: ' + e.message + ' - mencoba pulihkan kamera semula');
    // Coba pulihkan ke kamera semula supaya tidak mati total
    try {
      currentFacingMode = previousFacingMode;
      const restoredStream = await getStream(previousFacingMode);
      localStream = restoredStream;
      hiddenVideo.srcObject = localStream;
      const rv = restoredStream.getVideoTracks()[0];
      const ra = restoredStream.getAudioTracks()[0];
      for (const call of Object.values(activeCalls)) {
        const pc = call.peerConnection;
        if (!pc) continue;
        const vSender = pc.getSenders().find(s => s.track && s.track.kind === 'video');
        const aSender = pc.getSenders().find(s => s.track && s.track.kind === 'audio');
        if (vSender && rv) await vSender.replaceTrack(rv);
        if (aSender && ra) await aSender.replaceTrack(ra);
      }
      log('Kamera semula dipulihkan');
    } catch (e2) {
      log('Gagal pulihkan kamera: ' + e2.message);
    }
  } finally {
    switching = false;
  }
}

window.addEventListener('online', () => {
  log('Internet online kembali');
  if (!peer || peer.destroyed) connectPeer();
  else if (peer.disconnected) peer.reconnect();
});
window.addEventListener('offline', () => {
  log('Internet terputus');
  setLive('connecting');
});

startCamera();
</script>
</body>
</html>
